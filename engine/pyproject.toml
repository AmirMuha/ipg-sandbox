[project]
name = "ipg-sandbox-engine"
version = "0.1.0"
description = "Payment Gateway Sandbox Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "alembic",
    "httpx",
    "zeep",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
