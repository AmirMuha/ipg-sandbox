[project]
name = "ipg-sandbox-engine"
version = "0.1.0"
description = "Payment Gateway Sandbox Engine"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "httpx",
    "zeep",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
    "poethepoet"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
dev = "uvicorn src.api.app:app --reload --host 0.0.0.0 --port 8080"
test = "pytest -q"
test-v = "pytest -v"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
check = ["lint", "format-check"]
