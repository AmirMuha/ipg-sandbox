# Alembic configuration for the IPG Sandbox engine (T009).
# The URL below is a placeholder: alembic/env.py prefers DATABASE_URL from the environment
# (docker-compose sets it) and only falls back to this value.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/ipg_sandbox
