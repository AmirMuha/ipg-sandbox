services:
  engine:
    restart: unless-stopped
    # The whole .env reaches the container as env — config.py reads GITHUB_CLIENT_ID,
    # GOOGLE_CLIENT_ID, ADMIN_EMAILS, SESSION_TTL_DAYS, ZARINPAL_* straight from
    # os.environ, and none of those are named in `environment:` below, so without this
    # file they silently stayed at code defaults. `environment:` still wins over
    # env_file. Optional: CI checks out without a .env.
    env_file:
      - path: .env
        required: false
    build:
      context: ./apps/engine
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ipg_sandbox}
      - DEFAULT_PENDING_SETTLE_DELAY_S=${DEFAULT_PENDING_SETTLE_DELAY_S:-5}
      - DEFAULT_TIMEOUT_DELAY_S=${DEFAULT_TIMEOUT_DELAY_S:-30}
      - ENGINE_PROFILE=${ENGINE_PROFILE:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/project', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${ENGINE_PORT:-8080}}
    ports:
      - "${WEB_PORT:-${DASHBOARD_PORT:-3000}}:3000"
    environment:
      - ENGINE_URL=http://engine:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=15", "--spider", "http://127.0.0.1:3000/fa/home"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s
    depends_on:
      engine:
        condition: service_healthy
    networks:
      default:
        aliases:
          - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ipg_sandbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipg_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
