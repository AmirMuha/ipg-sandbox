services:
  engine:
    build:
      context: ./apps/engine
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ipg_sandbox}
      - DEFAULT_PENDING_SETTLE_DELAY_S=${DEFAULT_PENDING_SETTLE_DELAY_S:-5}
      - DEFAULT_TIMEOUT_DELAY_S=${DEFAULT_TIMEOUT_DELAY_S:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Baked into the client bundle at build time; must be a host-reachable URL.
        NEXT_PUBLIC_API_URL: http://localhost:${ENGINE_PORT:-8080}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ipg_sandbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipg_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
