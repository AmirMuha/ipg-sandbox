services:
  engine:
    build:
      context: ./apps/engine
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ipg_sandbox}
      - DEFAULT_PENDING_SETTLE_DELAY_S=${DEFAULT_PENDING_SETTLE_DELAY_S:-5}
      - DEFAULT_TIMEOUT_DELAY_S=${DEFAULT_TIMEOUT_DELAY_S:-30}
      - ENGINE_PROFILE=${ENGINE_PROFILE:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # stdlib urllib rather than curl: the engine image ships neither curl nor wget (T077).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/project', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Baked into the client bundle at build time; must be a host-reachable URL.
        NEXT_PUBLIC_API_URL: http://localhost:${ENGINE_PORT:-8080}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      # Server components fetch the engine during SSR, from inside the container, so they
      # need the compose-internal hostname. NEXT_PUBLIC_API_URL stays the host-reachable
      # value baked in at build time for the browser.
      - ENGINE_URL=http://engine:8080
    healthcheck:
      # wget is present in the node image; the engine's urllib probe is not. `/fa/transactions`
      # is a real rendered route, so this fails if SSR cannot reach the engine (T077).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/fa/transactions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  demo:
    profiles: ["demo"]
    build:
      context: apps/demo
    ports:
      - "${DEMO_PORT:-8000}:8000"
    environment:
      - ENGINE_URL=http://engine:8080
      - DASHBOARD_URL=http://dashboard:3000
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ipg_sandbox}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ipg_sandbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipg_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
