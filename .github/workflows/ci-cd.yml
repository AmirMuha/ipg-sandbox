name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: apps/engine
      # ponytail: no `poe check` gate — the tree currently fails ruff with 126 errors
      # (71 E501, 27 F401, 21 I001) that predate this workflow. Blocking on it would make
      # every PR red for unrelated reasons. Add it back after `ruff check --fix . &&
      # ruff format .` lands as its own commit.
      - run: poe test
        working-directory: apps/engine

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 300
      # Zarinpal only: every other gateway is parked disabled on a fresh volume
      # (seed_configs + migration 0009), so an idpay run would 404 at initiate. The idpay
      # surface is covered by tests/integration/test_scenario_matrix.py instead.
      - run: ./scripts/ci-scenario-run.sh --adapter zarinpal
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [test-engine, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # packages:write lets this job push to GHCR; the same token is forwarded to the box as
    # its `docker login` credential, so no extra secret is needed to pull the images.
    permissions:
      contents: read
      packages: write
    # Two pushes in quick succession must not race `git reset` + `compose up` on the same
    # box. cancel-in-progress stays false: cancelling a deploy mid-rebuild leaves the VPS
    # in an unknown state, so queue instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # The one place the prod client bundle gets its API origin: NEXT_PUBLIC_* is inlined
      # at build time (apps/web/Dockerfile), and the browser calls this origin, where nginx
      # routes /api/* to engine. Must be the same host the vhost serves.
      NEXT_PUBLIC_API_URL: http://ipg.sandboxed.ir
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: img
        # GHCR rejects uppercase repository paths, hence ${GITHUB_REPOSITORY,,}.
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build and push engine
        uses: docker/build-push-action@v6
        with:
          context: apps/engine
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-engine:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.base }}-engine:latest
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-web:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.base }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: appleboy/ssh-action@v1.0.3
        env:
          # One token, two jobs: the VPS checkout of this private repo, and the GHCR pull.
          # It expires when the run ends, so both are re-established every deploy.
          DEPLOY_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.img.outputs.tag }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_GH_TOKEN, GITHUB_ACTOR, IMAGE_TAG
          # A cold pull of both images from GHCR over this box's link can outlast the 10m
          # default.
          command_timeout: 30m
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_DIR }}"
            cd "${{ secrets.DEPLOY_DIR }}"
            remote="https://x-access-token:${DEPLOY_GH_TOKEN}@github.com/${{ github.repository }}.git"
            # First deploy: no checkout yet (reset alone needs one).
            [ -d .git ] || git clone "${remote}" .
            git remote set-url origin "${remote}"
            git fetch origin
            git reset --hard origin/main
            # 2 GB RAM with no swap: a cold-cache web build gets OOM-killed (dockerd logs
            # "failed to read oom_kill event" then buildkit's "frontend grpc server closed
            # unexpectedly"). One-time, idempotent.
            if ! swapon --show=NAME --noheadings 2>/dev/null | grep -q .; then
              sudo -n fallocate -l 2G /swapfile
              sudo -n chmod 600 /swapfile
              sudo -n mkswap /swapfile
              sudo -n swapon /swapfile
              sudo -n grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo -n tee -a /etc/fstab >/dev/null
            fi
            swapon --show
            # nginx owns 80/443 on this box: put our vhost in place and prove the config is
            # good before touching the stack. Reload happens after `up` so a caddy container
            # from an earlier deploy has already released the port.
            sudo -n install -m 0644 ./deploy/nginx/ipg.sandboxed.ir.conf /etc/nginx/sites-available/ipg.sandboxed.ir
            sudo -n ln -sfn /etc/nginx/sites-available/ipg.sandboxed.ir /etc/nginx/sites-enabled/ipg.sandboxed.ir
            sudo -n nginx -t
            # The box never builds: CI pushed sha-* (and :latest) to GHCR just above, and the
            # job token is the pull credential. `compose images` is the check — it must print
            # the sha tag this run built, proving a pull, not a local build, is running.
            echo "$DEPLOY_GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            # --remove-orphans drops the caddy container left by earlier deploys.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 300 --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml images
            sudo -n systemctl reload-or-restart nginx
      # A bind failure on 80/443 means something else already owns them on the box; this
      # prints who, so the next failure is diagnosable from the run log alone.
      - if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "== listeners on 80/443 =="
            sudo -n ss -ltnp 2>/dev/null || ss -ltnp 2>/dev/null || true
            echo "== containers =="
            docker ps -a
            echo "== http services =="
            systemctl list-units --type=service --state=running 2>/dev/null | grep -Ei 'nginx|caddy|apache|httpd|traefik|lighttpd' || true
            echo "== nginx files =="
            sudo -n ls -la /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ /etc/nginx/conf.d/ 2>/dev/null || true
            echo "== enabled vhosts =="
            sudo -n bash -c 'for f in /etc/nginx/sites-enabled/*; do [ -e "$f" ] && { echo "--- $f"; cat "$f"; }; done' 2>/dev/null || true
            echo "== nginx.conf directives =="
            sudo -n grep -nE "server_name|listen |include |ssl_certificate" /etc/nginx/nginx.conf 2>/dev/null || true
            echo "== letsencrypt =="
            sudo -n ls -la /etc/letsencrypt/live/ 2>/dev/null || true
            echo "== disk =="
            df -h
            echo "== mem =="
            free -m 2>/dev/null || true
            echo "== docker df =="
            docker system df
            echo "== docker daemon log =="
            sudo -n journalctl -u docker --no-pager -n 40 2>/dev/null || true
            echo "== recent oom kills =="
            sudo -n dmesg -T 2>/dev/null | grep -iE "killed process|out of memory" | tail -10 || true
