# Edge for the sandbox stack. nginx owns 80/443 on the VPS (novent.ir + mail.amirmuha.com),
# so this vhost joins them rather than competing for the ports: containers publish only
# 127.0.0.1:8081 (engine) and 127.0.0.1:3001 (web), see docker-compose.prod.yml.
# The deploy job installs this into /etc/nginx/sites-available and reloads nginx.
#
# TLS: /etc/letsencrypt/live/ipg.sandboxed.ir was issued with `certbot certonly --nginx` and
# renews under the same `nginx` authenticator as novent.ir / unopay.sandboxed.ir, so renewal
# needs no edits here. The cert must already exist when this file is installed — the deploy
# runs `nginx -t` first, and a missing ssl_certificate path fails it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ipg.sandboxed.ir;

    ssl_certificate     /etc/letsencrypt/live/ipg.sandboxed.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipg.sandboxed.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Engine API + IPG adapter return/callback routes: keep in sync with the routers
    # registered in apps/engine/src/api/app.py (and the provider adapter route prefixes).
    location ~ ^/(api|zarinpal|idpay|behpardakht|saman|sadad|pasargad|asan_pardakht|pardakht_novin|irankish|sizpay|fanava|sarmayeh)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # Web console
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ipg.sandboxed.ir;

    # The redirect lives inside `location /` rather than at server level on purpose: a
    # server-level `return` runs in the server-rewrite phase, before location selection, so
    # it would 301 certbot's `location /.well-known/acme-challenge/` away at renewal time
    # and every renewal would fail. Nested here, the longer challenge prefix still wins.
    location / {
        return 301 https://$host$request_uri;
    }
}
